<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INSTAGROM — Classroom LAN Social Network</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#fdf2f8',
              500: '#ec4899',
              600: '#db2777',
              700: '#be185d',
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    @keyframes heart-burst {
      0% { transform: scale(0); opacity: 0; }
      50% { transform: scale(1.3); opacity: 0.9; }
      100% { transform: scale(1); opacity: 0; }
    }
    .heart-burst {
      animation: heart-burst 0.7s ease-out forwards;
    }
    /* Custom scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased selection:bg-pink-500 selection:text-white flex flex-col md:flex-row">

  <!-- Root App Container -->
  <div id="app" class="flex-1 flex flex-col md:flex-row w-full min-h-screen">
    <!-- Content dynamically rendered by app.js -->
    <div class="flex-1 flex items-center justify-center min-h-screen">
      <div class="text-center">
        <div class="w-12 h-12 border-4 border-pink-500 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
        <p class="text-slate-400 text-sm">Connecting to INSTAGROM Python Host...</p>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
